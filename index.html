
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow - To-Do List</title>
  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
</head>
<body>
  <main class="app">
    <header class="header">
      <h1>✓ TaskFlow</h1>
      <p>A little progress every day.</p>
    </header>

    <section class="panel">
      <h2>My Tasks</h2>

      <div class="summary">
        <div>Total: <strong id="total-count">0</strong></div>
        <div>To do: <strong id="active-count">0</strong></div>
        <div>Completed: <strong id="done-count">0</strong></div>
      </div>

      <form id="task-form" class="add-form">
        <input
          id="task-input"
          type="text"
          placeholder="What needs to get done?"
          maxlength="180"
          required
        />
        <button class="add-btn" type="submit">+ Add Task</button>
      </form>

      <div class="filters">
        <button type="button" class="filter active" data-filter="all">All</button>
        <button type="button" class="filter" data-filter="active">To do</button>
        <button type="button" class="filter" data-filter="completed">Completed</button>
      </div>

      <div id="task-list"></div>
      <p id="empty-state">You're all caught up! Add a task to begin.</p>

      <button type="button" id="clear-completed" class="clear-btn">
        Clear completed tasks
      </button>
    </section>
  </main>
</body>
</html>
